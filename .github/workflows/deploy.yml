name: Deploy to Production

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# 需要在本仓库配置（Settings → Secrets and variables → Actions）：
#
# ACR_IMAGE       完整的镜像仓库地址，不带标签。从 ACR 控制台的仓库详情页直接复制，形如
#                 crpi-xxxxxxxx.cn-qingdao.personal.cr.aliyuncs.com/<命名空间>/<仓库名>
#
# ACR_PULL_IMAGE  （可选）服务器拉取镜像用的地址。服务器与 ACR 在同一地域时，
#                 填控制台给出的专有网络地址走内网，免公网流量费且更快；留空则与 ACR_IMAGE 相同
#
# DEPLOY_DIR      （可选）服务器上的部署目录，默认 /opt/1panel/docker/compose/equiptrack
#
# 上面三项放 Variables 或 Secrets 都能被识别（工作流会优先读 Variables）。
#
# 以下必须放 Secrets：
#   ACR_USERNAME / ACR_PASSWORD          ACR 访问凭证（用「固定密码」，不要用账号主密码）
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN Docker Hub 备份推送
#   REMOTE_HOST / REMOTE_USER / SSH_PRIVATE_KEY / REMOTE_PORT
#   FIREBASE_SERVICE_ACCOUNT_JSON        Firebase 服务账号 JSON 全文
#   INITIAL_ADMIN_CONTACT / INITIAL_ADMIN_PASSWORD  （可选）初始超级管理员

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 把镜像地址算好，后面构建与部署都用同一份，避免两处写法漂移
      - name: Resolve image references
        id: image
        env:
          # Variables 优先，未配置时回退到同名 Secret
          ACR_IMAGE: ${{ vars.ACR_IMAGE || secrets.ACR_IMAGE }}
          ACR_PULL_IMAGE: ${{ vars.ACR_PULL_IMAGE || secrets.ACR_PULL_IMAGE }}
        run: |
          set -euo pipefail

          if [ -z "${ACR_IMAGE:-}" ]; then
            echo "::error::请配置 ACR_IMAGE，值为不带标签的完整镜像地址，例如 crpi-xxxx.cn-qingdao.personal.cr.aliyuncs.com/命名空间/仓库名"
            exit 1
          fi

          # 去掉可能误填的标签后缀与结尾斜杠
          ACR_IMAGE="${ACR_IMAGE%/}"
          case "${ACR_IMAGE##*/}" in
            *:*) ACR_IMAGE="${ACR_IMAGE%:*}" ;;
          esac

          # 登录用的 registry 就是地址里第一个斜杠之前的部分
          REGISTRY="${ACR_IMAGE%%/*}"

          if [ "$REGISTRY" = "$ACR_IMAGE" ]; then
            echo "::error::ACR_IMAGE 需要包含命名空间与仓库名，当前只有域名：$ACR_IMAGE"
            exit 1
          fi

          # 未单独配置内网地址时，服务器也走公网地址拉取
          PULL_IMAGE_BASE="${ACR_PULL_IMAGE:-$ACR_IMAGE}"
          PULL_IMAGE_BASE="${PULL_IMAGE_BASE%/}"

          # 用 commit 短哈希作为不可变标签。部署时拉这个而不是 latest：
          # ACR 侧的自动构建同样会推 latest，两者可能互相覆盖，
          # 按 commit 拉取才能确定部署的到底是哪一次构建。
          SHA="$(git rev-parse --short HEAD)"
          echo "代码版本：$SHA"
          echo "推送目标：$ACR_IMAGE"

          {
            echo "registry=${REGISTRY}"
            echo "push_image=${ACR_IMAGE}"
            echo "sha=${SHA}"
            echo "pull_image=${PULL_IMAGE_BASE}:${SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 一次构建，同时推 ACR（部署源）与 Docker Hub / GHCR（备份）。
      # 除 latest 外再打一个 commit 标签，便于回滚到具体版本。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.push_image }}:latest
            ${{ steps.image.outputs.push_image }}:${{ steps.image.outputs.sha }}
            yemiao351/equiptrack:latest
            yemiao351/equiptrack:${{ steps.image.outputs.sha }}
            ghcr.io/hf-cygg/equiptrack-server:latest
            ghcr.io/hf-cygg/equiptrack-server:${{ steps.image.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare remote directories
        uses: appleboy/ssh-action@v1.0.3
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || secrets.DEPLOY_DIR || '/opt/1panel/docker/compose/equiptrack' }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT || 22 }}
          envs: FIREBASE_KEY,DEPLOY_DIR
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_DIR"/server/{config,data,logs,uploads}

            # 容器以非 root 的 node 用户（uid 1000）运行，挂载目录必须可写。
            # mysql 目录不在其中：官方镜像以 uid 999 运行，交给 Docker 自己处理。
            chown -R 1000:1000 "$DEPLOY_DIR"/server/{data,logs,uploads,config} 2>/dev/null || \
              sudo chown -R 1000:1000 "$DEPLOY_DIR"/server/{data,logs,uploads,config}

            if [ -n "${FIREBASE_KEY:-}" ]; then
              umask 077
              echo "$FIREBASE_KEY" > "$DEPLOY_DIR/server/config/serviceAccountKey.json"
              chown 1000:1000 "$DEPLOY_DIR/server/config/serviceAccountKey.json" 2>/dev/null || true
              echo "已更新 serviceAccountKey.json"
            fi

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT || 22 }}
          source: "docker-compose.yml"
          target: ${{ vars.DEPLOY_DIR || secrets.DEPLOY_DIR || '/opt/1panel/docker/compose/equiptrack' }}

      # .env.example 放到 server 子目录，与 compose 里的 ./server/.env 对齐
      - name: Copy env template
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT || 22 }}
          source: ".env.example"
          target: ${{ vars.DEPLOY_DIR || secrets.DEPLOY_DIR || '/opt/1panel/docker/compose/equiptrack' }}/server

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          PULL_IMAGE: ${{ steps.image.outputs.pull_image }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || secrets.DEPLOY_DIR || '/opt/1panel/docker/compose/equiptrack' }}
          # 可选：配了就在首次部署时写进 server/.env，由服务在空库上创建初始管理员
          INIT_ADMIN_CONTACT: ${{ secrets.INITIAL_ADMIN_CONTACT }}
          INIT_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT || 22 }}
          envs: PULL_IMAGE,DEPLOY_DIR,INIT_ADMIN_CONTACT,INIT_ADMIN_PASSWORD
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            # compose 通过同级目录的 .env 取 SERVER_IMAGE。
            # 这里只覆盖这一个键，其余内容保持不变。
            touch .env
            if grep -q '^SERVER_IMAGE=' .env; then
              sed -i "s|^SERVER_IMAGE=.*|SERVER_IMAGE=${PULL_IMAGE}|" .env
            else
              echo "SERVER_IMAGE=${PULL_IMAGE}" >> .env
            fi

            # server/.env 只在首次部署时生成，之后每次部署都原样保留。
            #
            # 必须只生成一次：MySQL 容器是用这里的口令做首次初始化的，
            # 数据目录一旦建立，口令就固定在库里了。若后续部署重新生成一份随机口令，
            # 服务端会连不上自己的数据库。
            if [ ! -f server/.env ]; then
              echo "首次部署：正在生成 server/.env"
              cp server/.env.example server/.env

              # 模板里的占位口令（change-this-...）不足 32 字符，会被服务端的
              # 启动校验直接拒绝。这里换成随机值，让容器第一次就能正常起来。
              GEN_JWT="$(openssl rand -base64 48 | tr -d '\n=+/' | cut -c1-48)"
              GEN_DB_PASS="$(openssl rand -base64 32 | tr -d '\n=+/' | cut -c1-24)"
              GEN_DB_ROOT_PASS="$(openssl rand -base64 32 | tr -d '\n=+/' | cut -c1-24)"

              sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${GEN_JWT}|" server/.env
              sed -i "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=${GEN_DB_PASS}|" server/.env
              sed -i "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=${GEN_DB_ROOT_PASS}|" server/.env

              # 配了初始管理员就一并写进去，服务首次启动时会在空库上创建这个账号。
              # 密码只在服务器的 .env 里落地，不会出现在构建日志中。
              if [ -n "${INIT_ADMIN_CONTACT:-}" ] && [ -n "${INIT_ADMIN_PASSWORD:-}" ]; then
                sed -i "s|^INITIAL_ADMIN_CONTACT=.*|INITIAL_ADMIN_CONTACT=${INIT_ADMIN_CONTACT}|" server/.env
                sed -i "s|^INITIAL_ADMIN_PASSWORD=.*|INITIAL_ADMIN_PASSWORD=${INIT_ADMIN_PASSWORD}|" server/.env
                echo "已写入初始管理员账号（密码取自 Secrets，未记录到日志）"
              fi

              # 容器内以 uid 1000 运行，.env 是只读挂载进去的，属主要对得上才读得到
              chown 1000:1000 server/.env 2>/dev/null || sudo chown 1000:1000 server/.env
              chmod 600 server/.env

              echo "已生成 server/.env，其中 JWT_SECRET 与数据库口令为随机值。"
              echo "CORS_ORIGIN 等业务配置请按实际情况调整。"
            else
              echo "server/.env 已存在，保持不变"
            fi

            # 兼容新旧两种 compose 命令
            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            $COMPOSE pull

            # 建表不在这里做：服务启动时会检查库里是否一张表都没有，
            # 空库才自动建表，已有数据的库完全不碰。
            $COMPOSE up -d --remove-orphans

            # 等健康检查转为 healthy 再判定部署成功
            echo "等待服务健康检查..."
            for i in $(seq 1 30); do
              STATUS="$(docker inspect -f '{{.State.Health.Status}}' equiptrack-server 2>/dev/null || echo starting)"
              if [ "$STATUS" = "healthy" ]; then
                echo "服务已就绪"
                docker image prune -f
                exit 0
              fi
              sleep 5
            done

            echo "服务在 150 秒内未变为 healthy，输出最近日志：" >&2
            docker logs --tail 100 equiptrack-server >&2
            exit 1
