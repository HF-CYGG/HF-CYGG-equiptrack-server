name: docker-image

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 阿里云 ACR 的镜像由 ACR 侧的「代码变更自动构建」直接从本仓库拉取构建，
      # 这里不再重复推送；此处保留 Docker Hub 与 GHCR 作为备份来源。
      # 生产部署使用的镜像由 EquipTrack 主仓库的 deploy 工作流推送到 ACR。
      - name: Build and push image to Docker Hub and GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # PR 只验证能否构建成功，不推送（来自 fork 的 PR 也拿不到 secrets）
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            yemiao351/equiptrack:latest
            yemiao351/equiptrack:${{ github.sha }}
            ghcr.io/hf-cygg/equiptrack-server:latest
            ghcr.io/hf-cygg/equiptrack-server:${{ github.sha }}
