name: build-and-push

# 构建镜像并推送到各镜像仓库。不做部署 —— 服务器上手动拉取更新：
#
#   cd /opt/1panel/docker/compose/equiptrack
#   docker compose pull && docker compose up -d
#
# PR 只做构建验证，不推送。
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# 需要在本仓库配置（Settings → Secrets and variables → Actions）：
#
# ACR_IMAGE  完整的镜像仓库地址，不带标签。从 ACR 控制台的仓库详情页直接复制，形如
#            crpi-xxxxxxxx.cn-qingdao.personal.cr.aliyuncs.com/<命名空间>/<仓库名>
#            放 Variables 或 Secrets 都能被识别（优先读 Variables）
#
# Secrets：
#   ACR_USERNAME / ACR_PASSWORD          ACR 访问凭证（用「固定密码」，不要用账号主密码）
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN Docker Hub 备份推送

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image references
        id: image
        env:
          ACR_IMAGE: ${{ vars.ACR_IMAGE || secrets.ACR_IMAGE }}
        run: |
          set -euo pipefail

          SHA="$(git rev-parse --short HEAD)"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "代码版本：$SHA"

          # PR 只验证构建。这里仍要给出一个合法的镜像名，
          # 否则 tags 里会出现以冒号开头的无效项而解析失败；push 为 false，不会真的推出去。
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push_image=local/equiptrack" >> "$GITHUB_OUTPUT"
            echo "registry=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "${ACR_IMAGE:-}" ]; then
            echo "::error::请配置 ACR_IMAGE，值为不带标签的完整镜像地址，例如 crpi-xxxx.cn-qingdao.personal.cr.aliyuncs.com/命名空间/仓库名"
            exit 1
          fi

          # 去掉可能误填的标签后缀与结尾斜杠
          ACR_IMAGE="${ACR_IMAGE%/}"
          case "${ACR_IMAGE##*/}" in
            *:*) ACR_IMAGE="${ACR_IMAGE%:*}" ;;
          esac

          # 登录用的 registry 就是地址里第一个斜杠之前的部分
          REGISTRY="${ACR_IMAGE%%/*}"

          if [ "$REGISTRY" = "$ACR_IMAGE" ]; then
            echo "::error::ACR_IMAGE 需要包含命名空间与仓库名，当前只有域名：$ACR_IMAGE"
            exit 1
          fi

          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "push_image=${ACR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "推送目标：$ACR_IMAGE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 一次构建，同时推 ACR（部署源）与 Docker Hub / GHCR（备份）。
      # 除 latest 外再打一个 commit 标签，需要回滚到具体版本时用得上。
      #
      # provenance / sbom 必须关掉：buildx 默认会附带 SLSA 证明，
      # 那会额外生成一个 application/vnd.oci.empty.v1+json 的空配置 manifest，
      # 阿里云 ACR 个人版不认这个类型，推送会以
      # 「unknown manifest class」被拒，而此时镜像层其实已经传完了。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          sbom: false
          tags: |
            ${{ steps.image.outputs.push_image }}:latest
            ${{ steps.image.outputs.push_image }}:${{ steps.image.outputs.sha }}
            yemiao351/equiptrack:latest
            yemiao351/equiptrack:${{ steps.image.outputs.sha }}
            ghcr.io/hf-cygg/equiptrack-server:latest
            ghcr.io/hf-cygg/equiptrack-server:${{ steps.image.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo "版本标签：\`${{ steps.image.outputs.sha }}\`"
            echo ""
            echo "服务器上更新："
            echo '```bash'
            echo "cd /opt/1panel/docker/compose/equiptrack"
            echo "docker compose pull && docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
