version: "3.8"

services:
  equiptrack-server:
    build:
      context: .
    image: yemiao351/equiptrack:latest
    container_name: EquipTrackServer
    restart: unless-stopped
    ports:
      - "13000:3000"
    volumes:
      - "/opt/equiptrack/data:/app/data"
      - "/opt/equiptrack/uploads:/app/uploads"
    env_file:
      - ./.env
    environment:
      MYSQL_HOST: mysql-server
      MYSQL_PORT: 3306
    networks:
      - mysql-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  mysql-network:
    external: true
    name: ${MYSQL_DOCKER_NETWORK:-dpanel-c-mysql-server_default}
